<div class="content">
    <!-- Settings Panel -->
    <div class="settings-panel" id="settings-panel">
        <h2 class="mb-4">Admin Settings</h2>
        <form id="settingsForm">
            <!-- Name -->
            <div class="form-group">
                <label for="adminName">Name</label>
                <input type="text" id="adminName" name="adminName" class="form-control" placeholder="Enter your name" required>
            </div>

            <!-- Profile Picture -->
            <div class="form-group">
                <label for="profilePic">Profile Picture</label>
                <input type="file" id="profilePic" name="profilePic" class="form-control" accept="image/*">
                <img id="profilePicPreview" src="#" alt="Profile Picture Preview" class="profile-pic-preview" style="display: none;">
            </div>

            <!-- Login Email -->
            <div class="form-group">
                <label for="adminEmail">Login Email</label>
                <input type="email" id="adminEmail" name="adminEmail" class="form-control" placeholder="Enter your email" required>
            </div>

            <!-- Password -->
            <div class="form-group password-field">
                <label for="adminPassword">Password</label>
                <div class="input-group">
                    <input type="password" id="adminPassword" name="adminPassword" class="form-control" placeholder="Enter new password" required>
                    <div class="input-group-append">
                        <span class="input-group-text toggle-password" onclick="togglePasswordVisibility('adminPassword')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                <small class="form-text text-muted">Password must be at least 8 characters long.</small>
            </div>

            <!-- Confirm Password -->
            <div class="form-group password-field">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm new password" required>
                    <div class="input-group-append">
                        <span class="input-group-text toggle-password" onclick="togglePasswordVisibility('confirmPassword')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                <small class="form-text text-muted">Passwords must match.</small>
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit" class="btn btn-primary" id="submitButton">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <div class="spinner-border text-primary d-none" id="loadingSpinner" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
        </form>
    </div>
</div>


<script>
// Toggle Settings Panel
const settingsLink = document.getElementById('settings-link');
const settingsPanel = document.getElementById('settings-panel');

settingsLink.addEventListener('click', function (e) {
    e.preventDefault(); // Prevent the default link behavior
    settingsPanel.classList.toggle('active'); // Toggle the 'active' class
});

// Handle Profile Picture Preview
const profilePicInput = document.getElementById('profilePic');
const profilePicPreview = document.getElementById('profilePicPreview');

profilePicInput.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
            profilePicPreview.src = e.target.result;
            profilePicPreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
});

// Handle Settings Form Submission
document.getElementById('settingsForm').addEventListener('submit', function (e) {
    e.preventDefault();

    // Show loading spinner
    const submitButton = document.getElementById('submitButton');
    const loadingSpinner = document.getElementById('loadingSpinner');
    submitButton.disabled = true;
    loadingSpinner.classList.remove('d-none');

    // Simulate API call delay
    setTimeout(() => {
        // Get form values
        const adminName = document.getElementById('adminName').value;
        const adminEmail = document.getElementById('adminEmail').value;
        const adminPassword = document.getElementById('adminPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Validate passwords match
        if (adminPassword !== confirmPassword) {
            alert('Passwords do not match. Please try again.');
            submitButton.disabled = false;
            loadingSpinner.classList.add('d-none');
            return;
        }

        // Simulate sending data to the server
        console.log('Updating settings with:', {
            name: adminName,
            email: adminEmail,
            password: adminPassword,
            profilePic: profilePicInput.files[0] ? profilePicInput.files[0].name : 'No file selected'
        });

        alert('Settings updated successfully!');
        settingsPanel.classList.remove('active'); // Hide the settings panel after submission
        submitButton.disabled = false;
        loadingSpinner.classList.add('d-none');
    }, 2000); // Simulate 2-second delay
});

// Toggle Password Visibility
function togglePasswordVisibility(fieldId) {
    const passwordField = document.getElementById(fieldId);
    const toggleIcon = passwordField.nextElementSibling.querySelector('i');

    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
    } else {
        passwordField.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
    }
}
</script>
