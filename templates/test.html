<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GunduziAI - Expert Review</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .review_container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #28a745;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-section label {
            display: inline-block;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .upload-section label:hover {
            background-color: #218838;
        }

        .preview-image {
            margin-top: 20px;
            max-width: 100%;
            border-radius: 10px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        .btn-submit i {
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .review_container {
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 14px;
            }

            .btn-submit {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="review_container">
        <h1>Expert Review & Disease Update</h1>

        <!-- Image Upload Section -->
        <div class="upload-section">
            <label for="image-upload">
                <i class="fas fa-upload"></i> Upload Image
            </label>
            <input type="file" id="image-upload" accept="image/*">
            <img id="preview-image" class="preview-image" src="#" alt="Preview" style="display: none;">
        </div>

        <!-- Disease Selection -->
        <div class="form-group">
            <label for="disease-name">Select Disease</label>
            <select id="disease-name" required>
                <option value="" disabled selected>Select a disease</option>
                <option value="Apple___Apple_scab">Apple Scab</option>
                <option value="Apple___Black_rot">Apple Black Rot</option>
                <option value="Apple___Cedar_rust">Apple Cedar Rust</option>
                <option value="Apple___healthy">Apple Healthy</option>
                <option value="Blueberry___healthy">Blueberry Healthy</option>
                <option value="Cherry_(including_sour)___Powdery_mildew">Cherry Powdery Mildew</option>
                <option value="Cherry_(including_sour)___healthy">Cherry Healthy</option>
                <option value="Corn_(maize)___Cercospora_leaf_spot Gray_leaf_spot">Corn Cercospora Leaf Spot</option>
                <option value="Corn_(maize)___Common_rust_">Corn Common Rust</option>
                <option value="Corn_(maize)___Northern_Leaf_Blight">Corn Northern Leaf Blight</option>
                <option value="Corn_(maize)___healthy">Corn Healthy</option>
                <option value="Grape___Black_rot">Grape Black Rot</option>
                <option value="Grape___Esca_(Black_Measles)">Grape Esca (Black Measles)</option>
                <option value="Grape___Leaf_blight_(Isariopsis_Leaf_Spot)">Grape Leaf Blight</option>
                <option value="Grape___healthy">Grape Healthy</option>
                <option value="Orange___Haunglongbing_(Citrus_greening)">Orange Haunglongbing (Citrus Greening)</option>
                <option value="Peach___Bacterial_spot">Peach Bacterial Spot</option>
                <option value="Peach___healthy">Peach Healthy</option>
                <option value="Pepper,_bell___Bacterial_spot">Pepper Bacterial Spot</option>
                <option value="Pepper,_bell___healthy">Pepper Healthy</option>
                <option value="Potato___Early_blight">Potato Early Blight</option>
                <option value="Potato___Late_blight">Potato Late Blight</option>
                <option value="Potato___healthy">Potato Healthy</option>
                <option value="Raspberry___healthy">Raspberry Healthy</option>
                <option value="Soybean___healthy">Soybean Healthy</option>
                <option value="Squash___Powdery_mildew">Squash Powdery Mildew</option>
                <option value="Strawberry___Leaf_scorch">Strawberry Leaf Scorch</option>
                <option value="Strawberry___healthy">Strawberry Healthy</option>
                <option value="Tomato___Bacterial_spot">Tomato Bacterial Spot</option>
                <option value="Tomato___Early_blight">Tomato Early Blight</option>
                <option value="Tomato___Late_blight">Tomato Late Blight</option>
                <option value="Tomato___Leaf_Mold">Tomato Leaf Mold</option>
                <option value="Tomato___Septoria_leaf_spot">Tomato Septoria Leaf Spot</option>
                <option value="Tomato___Spider_mites Two-spotted_spider_mite">Tomato Spider Mites</option>
                <option value="Tomato___Target_Spot">Tomato Target Spot</option>
                <option value="Tomato___Tomato_Yellow_Leaf_Curl_Virus">Tomato Yellow Leaf Curl Virus</option>
                <option value="Tomato___Tomato_mosaic_virus">Tomato Mosaic Virus</option>
                <option value="Tomato___healthy">Tomato Healthy</option>
            </select>
        </div>

        <!-- Symptoms Section -->
        <div class="form-group">
            <label for="symptoms">Symptoms</label>
            <textarea id="symptoms" placeholder="List the symptoms of the disease..." required></textarea>
        </div>

        <!-- Treatment Recommendations -->
        <div class="form-group">
            <label for="treatment">Treatment Recommendations</label>
            <textarea id="treatment" placeholder="Provide treatment recommendations..." required></textarea>
        </div>

        <!-- Submit Button -->
        <button type="button" id="submit-button" class="btn-submit">
            <i class="fas fa-paper-plane"></i> Submit Diagnosis
        </button>
    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- JavaScript for Image Preview and Form Handling -->
    <script>
        // Image Preview Functionality
        const imageUpload = document.getElementById('image-upload');
        const previewImage = document.getElementById('preview-image');

        imageUpload.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    previewImage.src = event.target.result;
                    previewImage.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Form Submission Handling
        const submitButton = document.getElementById('submit-button');
        submitButton.addEventListener('click', function () {
            // Get form data
            const image = imageUpload.files[0];
            const diseaseName = document.getElementById('disease-name').value;
            const symptoms = document.getElementById('symptoms').value;
            const treatment = document.getElementById('treatment').value;

            // Validate form inputs
            if (!image || !diseaseName || !symptoms || !treatment) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Please fill out all fields before submitting!',
                });
                return;
            }

            // Simulate sending expert review to the database
            setTimeout(() => {
                const Toast = Swal.mixin({
                    toast: true,
                    position: "top-end",
                    showConfirmButton: false,
                    timer: 1500,
                    timerProgressBar: true,
                    didOpen: (toast) => {
                        toast.onmouseenter = Swal.stopTimer;
                        toast.onmouseleave = Swal.resumeTimer;
                    }
                });
                Toast.fire({
                    icon: "success",
                    title: "Your disease review has been sent to the database successfully!"
                }).then(() => {
                    // Reset the form
                    imageUpload.value = ''; // Clear file input
                    document.getElementById('disease-name').value = '';
                    document.getElementById('symptoms').value = '';
                    document.getElementById('treatment').value = '';
                    previewImage.style.display = 'none'; // Hide the preview image
                });
            }, 1000); // Simulate a 1-second delay
        });
    </script>
</body>
</html>
