<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Site Metas -->
    <meta name="keywords" content="GunduziAi" />
    <meta name="description" content="GunduziAi" />
    <meta name="author" content="Vincent Were" />
    <title>GunduziAi SignUp/SignIn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" type="text/css" href="css/login_signup.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <!-- SweetAlert CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="/static/img/gunduzi_logo.png" type="image/icon type">
    <!-- Customized Bootstrap Stylesheet -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">
    <!-- The Stylesheet -->
    <link href="/static/css/login_signup.css" rel="stylesheet">
    <style>
        .error-message {
            font-size: 0.8em; 
            margin-top: 5px;
            color: red; 
            display: none; 
        }
    </style>
</head>
<body class="login_signup">
    <div class="containers" id="containers">
        <div class="form-containers sign-up-container">
            <form class="login_signup_form" name="sign_up_form" id="sign_up_form" method="post" action="{{ url_for('signup') }}" enctype="multipart/form-data">
                <h1 id="h1">Create Account</h1>
                <span id="span">Enter your details to register</span>
                <div class="input-container">
                    <i class="fa fa-user icon"></i>
                    <input type="text" id="first_name" name="first_name" placeholder="First Name" required />
                </div>
                <div class="input-container">
                    <i class="fa fa-user icon"></i>
                    <input type="text" id="last_name" name="last_name" placeholder="Last Name" required />
                </div>
                <div class="input-container">
                    <i class="fa fa-briefcase icon"></i>
                    <select id="user_role" name="user_role" required>
                        <option value="" disabled selected>Select Role</option>
                        <option value="farmer">Farmer/Grower</option>
                        <option value="agronomist">Agronomist/Expert</option>
                        <option value="researcher">Researcher/Scientist</option>
                    </select>
                </div>
                <div class="input-container">
                    <i class="fa fa-phone icon"></i>
                    <input type="tel" id="phone_number" name="phone_number" placeholder="Phone Number" required />
                </div>
                <label id="phone_error" class="error-message"></label>
                <div class="input-container">
                    <i class="fa fa-envelope icon"></i>
                    <input type="email" id="email_input" name="email" placeholder="Email" required />
                </div>
                <label id="email_error" class="error-message"></label>
                <div class="input-container">
                    <i class="fa fa-lock icon"></i>
                    <input type="password" id="password_input" name="password" placeholder="Password" required />
                    <i class="fa fa-eye" id="togglePassword" style="right: -70px; left: auto;"></i>
                </div>
                <label id="password_error" class="error-message"></label>
                <div class="input-container">
                    <i class="fa fa-lock icon"></i>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required />
                    <i class="fa fa-eye" id="toggleConfirmPassword" style="right: -70px; left: auto;"></i>
                    <label id="confirm_password_error" class="error-message"></label>
                </div>
                <button type="button" id="btn_signup" name="sign_up" class="btn_signin_success">SignUp</button>
            </form>
        </div>
        <div class="form-containers sign-in-container">
            <form name="login_form" id="login_form" method="post" class="login_signup_form" action="{{ url_for('login') }}" enctype="multipart/form-data">
                <h1 id="h1">Sign In</h1>
                <span id="span">Enter your credentials to login</span>
                <div class="input-container">
                    <i class="fa fa-envelope icon"></i>
                    <input type="email" id="login_email" name="email" placeholder="Email" required />
                </div>
                <div class="input-container">
                    <i class="fa fa-lock icon"></i>
                    <input type="password" id="login_password" name="password" placeholder="Password" required />
                    <i class="fa fa-eye" id="toggleLoginPassword" style="right: -70px; left: auto;"></i>
                </div>
                <h6><span id="pass_warning"></span></h6>
                <label for="forgot_password" id="forgetPassLabel"><a class="forgot_password" href="#">Forgot Your Password?</a></label>
                <button type="button" id="btn_signin" name="btn_signin_success" class="btn_signIn">Sign In</button>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panels overlay-left">
                    <h1 style="color: aliceblue;" id="h1">Welcome Back!</h1>
                    <p id="paragraph">To keep connected with us please login with your personal info.</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panels overlay-right">
                    <h1 style="color: aliceblue;" id="h1">Hello! Welcome to GunduziAi🌿</h1>
                    <p id="paragraph">Enter your details and start your journey with us.</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        const signUpButton = document.getElementById("signUp");
        const signInButton = document.getElementById("signIn");
        const container = document.getElementById("containers");
        signUpButton.addEventListener("click", () => {
            container.classList.add("right-panel-active");
        });
        signInButton.addEventListener("click", () => {
            container.classList.remove("right-panel-active");
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.10.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhLVUakKUeEoOF2JCoijLViWaEPsYdE6g",
            authDomain: "gunduziai.firebaseapp.com",
            projectId: "gunduziai",
            storageBucket: "gunduziai.firebasestorage.app",
            messagingSenderId: "340515946915",
            appId: "1:340515946915:web:1601c25ebe2c57283fda16",
            measurementId: "G-SXT2J5XX1H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Forgot password functionality
        const forgetPassLabel = document.getElementById("forgetPassLabel");

        // Password Visibility Toggle
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password_input');
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        const toggleConfirmPassword = document.querySelector('#toggleConfirmPassword');
        const confirmPasswordInput = document.querySelector('#confirm_password');
        toggleConfirmPassword.addEventListener('click', function () {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        const toggleLoginPassword = document.querySelector('#toggleLoginPassword');
        const loginPasswordInput = document.querySelector('#login_password');
        toggleLoginPassword.addEventListener('click', function () {
            const type = loginPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPasswordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        // Phone Number Validation Regex
        const phoneRegex = /^(?:\+254|0)[17]\d{8}$/;

        // Email Validation Regex
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Password Validation Regex
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

        // Registration
        document.getElementById('btn_signup').addEventListener('click', function () {
            const firstName = document.getElementById('first_name').value;
            const lastName = document.getElementById('last_name').value;
            const userRole = document.getElementById('user_role').value;
            const phoneNumber = document.getElementById('phone_number').value;
            const email = document.getElementById('email_input').value;
            const password = document.getElementById('password_input').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            // Reset error messages
            document.getElementById('phone_error').style.display = 'none';
            document.getElementById('email_error').style.display = 'none';
            document.getElementById('password_error').style.display = 'none';
            document.getElementById('confirm_password_error').style.display = 'none';

            // Validate phone number
            if (!phoneRegex.test(phoneNumber)) {
                document.getElementById('phone_error').textContent = 'Please enter a valid phone number (e.g., +254712345678 or 0712345678).';
                document.getElementById('phone_error').style.display = 'block';
                return;
            }

            // Validate email
            if (!emailRegex.test(email)) {
                document.getElementById('email_error').textContent = 'Please enter a valid email address.';
                document.getElementById('email_error').style.display = 'block';
                return;
            }

            // Validate password strength
            if (!passwordRegex.test(password)) {
                document.getElementById('password_error').textContent = 'Password must be at least 8 characters long, include an uppercase letter, a lowercase letter, a number, and a special character.';
                document.getElementById('password_error').style.display = 'block';
                return;
            }

            // Check if passwords match
            if (password !== confirmPassword) {
                document.getElementById('confirm_password_error').textContent = 'Passwords do not match!';
                document.getElementById('confirm_password_error').style.display = 'block';
                return;
            }

            // Proceed with Firebase registration
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Send data to the Flask backend for database storage
                    fetch('/signup', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            first_name: firstName,
                            last_name: lastName,
                            user_role: userRole,
                            phone_number: phoneNumber,
                            email: email,
                            password: password,
                        }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Store the user's first name in the session
                            fetch('/set_session', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({ first_name: firstName, email: email }),
                            }).then(() => {
                                const Toast = Swal.mixin({
                                    toast: true,
                                    position: "top-end",
                                    showConfirmButton: false,
                                    timer: 3500,
                                    timerProgressBar: true,
                                    didOpen: (toast) => {
                                        toast.onmouseenter = Swal.stopTimer;
                                        toast.onmouseleave = Swal.resumeTimer;
                                    }
                                });
                                Toast.fire({
                                    icon: "success",
                                    title: "Registration successful! Back to login"
                                }).then(() => {
                                    container.classList.remove("right-panel-active");
                                });
                            });

                        } else {
                            Swal.fire('Error', data.error, 'error');
                        }
                    })
                    .catch((error) => {
                        Swal.fire('Error', 'An error occurred during sign up.', 'error');
                    });

                })
                .catch((error) => {
                    Swal.fire('Error', error.message, 'error');
                });
        });
        // Login start
        document.getElementById('btn_signin').addEventListener('click', function () {
            const email = document.getElementById('login_email').value;
            const password = document.getElementById('login_password').value;

            if (email === "admintest@gmail.com" && password === "@Admin1234") {
                // Admin login
                document.getElementById('login_form').submit();
                return; // Exit the function to prevent further processing
            }

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Store the user's first name in the session
                    fetch('/set_session', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ first_name: userCredential.user.email.split('@')[0], email: email }),
                    }).then(() => {
                        const Toast = Swal.mixin({
                            toast: true,
                            position: "top-end",
                            showConfirmButton: false,
                            timer: 1500,
                            timerProgressBar: true,
                            didOpen: (toast) => {
                                toast.onmouseenter = Swal.stopTimer;
                                toast.onmouseleave = Swal.resumeTimer;
                            }
                        });
                        Toast.fire({
                            icon: "success",
                            title: "Login successful!"
                        }).then(() => {
                            window.location.href = '/';
                        });
                    });
                })
                .catch((error) => {
                    Swal.fire('Error', 'Invalid Username/Password!', 'error');
                });
        });
        // Reset Password
        forgetPassLabel.addEventListener("click", function () {
            const email = document.getElementById('login_email').value;

            if (!email) {
                Swal.fire('Error', 'Please enter your email address.', 'error');
                return;
            }

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    Swal.fire('Success', 'A password reset link has been sent to your email.', 'success');
                })
                .catch((error) => {
                    Swal.fire('Error', error.message, 'error');
                });
        });
    </script>
</body>
