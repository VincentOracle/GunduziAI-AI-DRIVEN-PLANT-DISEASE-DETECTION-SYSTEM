<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Site Metas -->
    <meta name="keywords" content="GunduziAi" />
    <meta name="description" content="GunduziAi" />
    <meta name="author" content="Vincent Were" />
    <title>GunduziAi SignUp/SignIn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
    <link rel="stylesheet" type="text/css" href="css/login_signup.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <!-- SweetAlert CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="/static/img/gunduzi_logo.png" type="image/icon type">
    <!-- Customized Bootstrap Stylesheet -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">
    <!-- The Stylesheet -->
    <link href="/static/css/login_signup.css" rel="stylesheet">
  </head>
  <body class="login_signup">
    <div class="containers" id="containers">
      <div class="form-containers sign-up-container">
        <form
          class="login_signup_form"
          name="sign_up_form"
          id="sign_up_form"
          method="post"
          action="#"
          enctype="multipart/form-data"
        >
          <h1 id="h1">Create Account</h1>
          <span id="span">Enter your details to register</span>
          <div class="input-container">
            <i class="fa fa-user icon"></i>
            <input type="text" id="first_name" name="first_name" placeholder="First Name" required />
          </div>
          <div class="input-container">
            <i class="fa fa-user icon"></i>
            <input type="text" id="last_name" name="last_name" placeholder="Last Name" required />
          </div>
          <div class="input-container">
            <i class="fa fa-briefcase icon"></i>
            <select id="user_role" name="user_role" required>
              <option value="" disabled selected>Select Role</option>
              <option value="farmer">Farmer/Grower</option>
              <option value="agronomist">Agronomist/Expert</option>
              <option value="researcher">Researcher/Scientist</option>
              <!-- <option value="admin">System Administrator</option> -->
            </select>
          </div>
          <div class="input-container">
            <i class="fa fa-phone icon"></i>
            <input type="tel" id="phone_number" name="phone_number" placeholder="Phone Number" required />
          </div>
          <div class="input-container">
            <i class="fa fa-envelope icon"></i>
            <input type="email" id="email_input" name="email" placeholder="Email" required />
          </div>
          <div class="input-container">
            <i class="fa fa-lock icon"></i>
            <input type="password" id="password_input" name="password" placeholder="Password" required />
            <i class="fa fa-eye" id="togglePassword" style="right: 10px; left: auto;"></i>
          </div>
          <div class="input-container">
            <i class="fa fa-lock icon"></i>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required />
            <i class="fa fa-eye" id="toggleConfirmPassword" style="right: 10px; left: auto;"></i>
          </div>
          <button type="button" id="btn_signup" name="sign_up" class="btn_signin_success">SignUp</button>
        </form>
      </div>
      <div class="form-containers sign-in-container">
        <form
          name="login_form"
          id="login_form"
          method="post"
          class="login_signup_form"
          action="#"
          enctype="multipart/form-data"
        >
          <h1 id="h1">Sign In</h1>
          <span id="span">Enter your credentials to login</span>
          <div class="input-container">
            <i class="fa fa-envelope icon"></i>
            <input type="email" id="login_email" name="email" placeholder="Email" required />
          </div>
          <div class="input-container">
            <i class="fa fa-lock icon"></i>
            <input type="password" id="login_password" name="password" placeholder="Password" required />
            <i class="fa fa-eye" id="toggleLoginPassword" style="right: 10px; left: auto;"></i>
          </div>
          <h6><span id="pass_warning"></span></h6>
          <a class="forgot_password" href="#">Forgot Your Password?</a>
          <button type="button" id="btn_signin" name="btn_signin_success" class="btn_signIn">Sign In</button>
        </form>
      </div>
      <div class="overlay-container">
        <div class="overlay">
          <div class="overlay-panels overlay-left">
            <h1 id="h1">Welcome Back!</h1>
            <p id="paragraph">To keep connected with us please login with your personal info</p>
            <button class="ghost" id="signIn">Sign In</button>
          </div>
          <div class="overlay-panels overlay-right">
            <h1 id="h1">Hello! Welcome to GunduziAi🌿</h1>
            <p id="paragraph">Enter your details and start journey with us</p>
            <button class="ghost" id="signUp">Sign Up</button>
          </div>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      const signUpButton = document.getElementById("signUp");
      const signInButton = document.getElementById("signIn");
      const container = document.getElementById("containers");
      signUpButton.addEventListener("click", () => {
        container.classList.add("right-panel-active");
      });
      signInButton.addEventListener("click", () => {
        container.classList.remove("right-panel-active");
      });
    </script>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    

  <!-- cript to handle Firebase authentication, SweetAlert integration and session storage -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.10.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.10.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBhLVUakKUeEoOF2JCoijLViWaEPsYdE6g",
    authDomain: "gunduziai.firebaseapp.com",
    projectId: "gunduziai",
    storageBucket: "gunduziai.firebasestorage.app",
    messagingSenderId: "340515946915",
    appId: "1:340515946915:web:1601c25ebe2c57283fda16",
    measurementId: "G-SXT2J5XX1H"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Password Visibility Toggle
  const togglePassword = document.querySelector('#togglePassword');
  const passwordInput = document.querySelector('#password_input');
  togglePassword.addEventListener('click', function () {
  const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
  passwordInput.setAttribute('type', type);
  this.classList.toggle('fa-eye-slash');
  });

  const toggleConfirmPassword = document.querySelector('#toggleConfirmPassword');
  const confirmPasswordInput = document.querySelector('#confirm_password');
  toggleConfirmPassword.addEventListener('click', function () {
  const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
  confirmPasswordInput.setAttribute('type', type);
  this.classList.toggle('fa-eye-slash');
  });

  const toggleLoginPassword = document.querySelector('#toggleLoginPassword');
  const loginPasswordInput = document.querySelector('#login_password');
  toggleLoginPassword.addEventListener('click', function () {
    const type = loginPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    loginPasswordInput.setAttribute('type', type);
    this.classList.toggle('fa-eye-slash');
  });

//  Registration
      document.getElementById('btn_signup').addEventListener('click', function () {
        const email = document.getElementById('email_input').value;
        const password = document.getElementById('password_input').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const firstName = document.getElementById('first_name').value;

        if (password !== confirmPassword) {
          Swal.fire('Error', 'Passwords do not match!', 'error');
          return;
        }

    createUserWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        // Store the user's first name in the session
        fetch('/set_session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ first_name: firstName }),
        }).then(() => {

          const Toast = Swal.mixin({
          toast: true,
          position: "top-end",
          showConfirmButton: false,
          timer: 3500,
          timerProgressBar: true,
          didOpen: (toast) => {
          toast.onmouseenter = Swal.stopTimer;
          toast.onmouseleave = Swal.resumeTimer;
        }
      });
      Toast.fire({
      icon: "success",
      title: "Registration successful! Back to login"
      }).then(() => {
            container.classList.remove("right-panel-active");
          });
        });
      })
      .catch((error) => {
        Swal.fire('Error', error.message, 'error');
      });
  });

  // Login
  document.getElementById('btn_signin').addEventListener('click', function () {
    const email = document.getElementById('login_email').value;
    const password = document.getElementById('login_password').value;
    const firstName = document.getElementById('first_name').value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        // Store the user's first name in the session
        fetch('/set_session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ first_name: userCredential.user.email }), // Use email or fetch first name from Firestore
        }).then(() => {
          Swal.fire('Success', 'Login successful!', 'success').then(() => {
            window.location.href = '/';
          });
        });
      })
      .catch((error) => {
        Swal.fire('Error', error.message, 'error');
        Swal.fire('Error', 'Invalid username/Password!', 'error');
      });
  });
</script>
</body>
</html>
